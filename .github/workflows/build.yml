name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: |
          if (Get-ChildItem -Recurse -Filter *.Tests.csproj) {
            dotnet test -c Release --logger "console;verbosity=normal"
          } else {
            Write-Host "no test projects yet - skipping"
          }

      - name: Publish
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish/win-x64

      - uses: actions/upload-artifact@v7
        with:
          name: ScweenSpit-${{ github.sha }}
          path: publish/win-x64/ScweenSpit.exe
          if-no-files-found: error
          retention-days: 30
