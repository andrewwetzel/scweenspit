name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build -c Release

      - name: Test
        shell: pwsh
        run: |
          # Each test project is named explicitly: a bare "dotnet test" at the repo root resolves
          # only the root project, discovers nothing, and exits 0 - a green tick over zero tests.
          $tests = Get-ChildItem -Recurse -Filter *.Tests.csproj
          if (-not $tests) { Write-Host "no test projects yet - skipping"; exit 0 }
          foreach ($t in $tests) {
            dotnet test $t.FullName -c Release --logger "console;verbosity=normal"
            # pwsh only surfaces the LAST native exit code, so a failure mid-loop would be lost.
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Publish
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish/win-x64

      - uses: actions/upload-artifact@v7
        with:
          name: ScweenSpit-${{ github.sha }}
          path: publish/win-x64/ScweenSpit.exe
          if-no-files-found: error
          retention-days: 30
