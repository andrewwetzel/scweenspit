name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build -c Release

      - name: Test
        shell: pwsh
        run: |
          # Each test project is named explicitly: a bare "dotnet test" at the repo root resolves
          # only the root project, discovers nothing, and exits 0 - a green tick over zero tests.
          $tests = Get-ChildItem -Recurse -Filter *.Tests.csproj
          if (-not $tests) { Write-Host "no test projects yet - skipping"; exit 0 }
          foreach ($t in $tests) {
            dotnet test $t.FullName -c Release --logger "console;verbosity=normal"
            # pwsh only surfaces the LAST native exit code, so a failure mid-loop would be lost.
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Publish app
        run: dotnet publish ScweenSpit.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o publish/app

      - name: Bundle into the shipping exe
        shell: pwsh
        run: |
          # The outer exe embeds the app, so the app has to exist first. Native AOT cannot be
          # cross-compiled, which is why this step only ever runs here.
          New-Item -ItemType Directory -Force launcher/payload | Out-Null
          Copy-Item publish/app/ScweenSpit.exe launcher/payload/ScweenSpit.exe -Force
          dotnet publish launcher/ScweenSpit.Launcher.csproj -c Release -r win-x64 -o publish/ship
          "{0,-22} {1,8:N0} KB  (embedded)" -f "app", ((Get-Item publish/app/ScweenSpit.exe).Length / 1KB)
          "{0,-22} {1,8:N0} KB  (shipped)"  -f "ScweenSpit.exe", ((Get-Item publish/ship/ScweenSpit.exe).Length / 1KB)

      - uses: actions/upload-artifact@v7
        with:
          name: ScweenSpit-${{ github.sha }}
          path: |
            publish/ship/ScweenSpit.exe
            publish/app/ScweenSpit.exe
          if-no-files-found: error
          retention-days: 30
