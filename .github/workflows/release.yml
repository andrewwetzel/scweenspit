name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish ScweenSpit.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o publish/app

          New-Item -ItemType Directory -Force launcher/payload | Out-Null
          Copy-Item publish/app/ScweenSpit.exe launcher/payload/ScweenSpit.exe -Force
          dotnet publish launcher/ScweenSpit.Launcher.csproj -c Release -r win-x64 -o publish/setup

          Copy-Item publish/setup/ScweenSpit-Setup.exe "ScweenSpit-Setup-${env:TAG}.exe"
          Copy-Item publish/app/ScweenSpit.exe        "ScweenSpit-${env:TAG}-win-x64.exe"

      - name: Create release
        run: gh release create "$env:TAG" --title "ScweenSpit $env:TAG" --generate-notes ScweenSpit-Setup-*.exe ScweenSpit-*-win-x64.exe
