name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        shell: pwsh
        run: |
          # The tag is the version. The app compares it against its own assembly version to decide
          # whether an update exists, so an unstamped build would never see one.
          $version = $env:TAG -replace '^v', ''
          Write-Host "building version $version"

          dotnet publish ScweenSpit.csproj -c Release -r win-x64 --self-contained false `
            -p:PublishSingleFile=true -p:Version=$version -o publish/app

          New-Item -ItemType Directory -Force launcher/payload | Out-Null
          Copy-Item publish/app/ScweenSpit.exe launcher/payload/ScweenSpit.exe -Force
          dotnet publish launcher/ScweenSpit.Launcher.csproj -c Release -r win-x64 `
            -p:Version=$version -o publish/ship

          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item publish/ship/ScweenSpit.exe release/ScweenSpit.exe

          # Published beside the exe so the updater can tell a truncated download from a whole one.
          $hash = (Get-FileHash release/ScweenSpit.exe -Algorithm SHA256).Hash
          "$hash  ScweenSpit.exe" | Out-File -Encoding ascii release/ScweenSpit.exe.sha256
          Write-Host "sha256 $hash"

      - name: Create release
        run: gh release create "$env:TAG" --title "ScweenSpit $env:TAG" --generate-notes release/ScweenSpit.exe release/ScweenSpit.exe.sha256
